<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Request Food - Save Bite</title>
<link rel="stylesheet" href="styleee.css">
</head>

<body class="request-body">

<div class="request-container">

<h2>Request Food</h2>
<p>Fill the form to request available food</p>

<form class="request-form">

<input type="text" placeholder="NGO / Organization Name" required>

<input type="text" placeholder="Contact Number" required>

<input type="text" placeholder="Pickup Location" required>

<input type="datetime-local" required>

<textarea placeholder="Additional Message (optional)"></textarea>

<button type="submit">Submit Request</button>

</form>

</div>

</body>
</html>
