<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Save Bite</title>
<link rel="stylesheet" href="styleee.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<div class="login-container">

<div class="login-box">

<h2>Welcome Back 👋</h2>
<p>Login to continue to Save Bite</p>

<form  action="auth/login.php" method="POST">

<input type="email" name="email" placeholder="Email Address" required>
<input type="password" name="password" placeholder="Password" required>
<!-- FORGOT PASSWORD -->
<div class="forgot-password">
<a href="#" onclick="openPopup()">Forgot Password?</a>
</div>

<button type="submit">Login</button>

</form>
<!-- FORGOT PASSWORD POPUP -->
<!-- FORGOT PASSWORD POPUP -->
<div id="forgotPopup" class="popup">

<div class="popup-content">

<span class="close-btn" onclick="closePopup()">&times;</span>

<h3>Reset Password 🔑</h3>
<p>Enter your email and set a new password</p>

<form action="auth/forgot_password.php" method="POST">
<input type="email" name="email" placeholder="Enter your email" required>
<input type="password" name="new_password" placeholder="New Password" required>
<input type="password" name="confirm_password" placeholder="Confirm New Password" required>
<button type="submit">Reset Password</button>
</form>

</div>
</div>

<p class="register-link">
Don't have an account? <a href="register.html">Register</a>
</p>

</div>

</div>
<script>

function openPopup(){
document.getElementById("forgotPopup").style.display = "flex";
}

function closePopup(){
document.getElementById("forgotPopup").style.display = "none";
}

// BUTTON CLICK FUNCTION
function sendLink(){
alert("Reset link sent to your email 📧");
closePopup();
}

</script>

</body>
</html>
