<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Donate Food - Save Bite</title>
<link rel="stylesheet" href="styleee.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<div class="donate-container">

<div class="donate-box">

<h2>Donate Food 🍱</h2>
<p>Help reduce food waste by donating surplus food</p>

<form action="add_donation.php" method="POST">

<input type="text"name="food_name" placeholder="Food Name" required>
<input type="number" name="Quantity" placeholder="Quantity (e.g. 10 plates)" required>
<input type="text" name="Pickup Location" placeholder="Pickup Location" required>

<input type="datetime-local" required>

<input type="tel"name="Contact" placeholder="Contact Number" required>

<textarea placeholder="Additional Details (optional)"></textarea>

<button type="submit">Submit Donation</button>

</form>

</div>

</div>

</body>
</html>
