<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteers - Save Bite NGO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--green:#2e7d32;--green-light:#43a047;--green-pale:#e8f5e9;--green-accent:#66bb6a;--gray:#f4f6f4;--text:#1b2e1c;--muted:#6b7c6b;--sw:240px;--shadow:0 2px 12px rgba(46,125,50,.10);}
  body{font-family:'Poppins',sans-serif;background:var(--gray);color:var(--text);display:flex;}
  .sidebar{width:var(--sw);background:linear-gradient(180deg,#1b5e20,#2e7d32);min-height:100vh;position:fixed;left:0;top:0;display:flex;flex-direction:column;z-index:100;}
  .sb-logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
  .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .logo-row .li{width:34px;height:34px;background:#fff;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;}
  .logo-row h2{color:#fff;font-size:1.1rem;font-weight:700;}.logo-row h2 span{color:#66bb6a;}
  .ngo-badge{background:rgba(102,187,106,.2);border:1px solid rgba(102,187,106,.35);border-radius:8px;padding:8px 11px;display:flex;align-items:center;gap:9px;}
  .ngo-ava{width:32px;height:32px;border-radius:8px;background:var(--green-accent);font-size:.95rem;display:flex;align-items:center;justify-content:center;}
  .ngo-badge-info .nb-name{color:#fff;font-size:.8rem;font-weight:600;}.ngo-badge-info .nb-type{color:rgba(255,255,255,.5);font-size:.67rem;}
  .sb-nav{padding:14px 0;flex:1;}
  .nl{color:rgba(255,255,255,.4);font-size:.65rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:8px 20px 3px;}
  .ni{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.78);cursor:pointer;transition:all .2s;font-size:.86rem;border-left:3px solid transparent;text-decoration:none;}
  .ni:hover,.ni.active{background:rgba(255,255,255,.11);color:#fff;border-left-color:#66bb6a;}
  .ni .ic{font-size:.95rem;width:18px;text-align:center;}
  .sb-bot{padding:12px 20px;border-top:1px solid rgba(255,255,255,.12);}
  .lo{display:flex;align-items:center;gap:9px;cursor:pointer;}.lo span{color:rgba(255,255,255,.6);font-size:.82rem;transition:color .2s;}.lo:hover span{color:#ff6b6b;}
  .main{margin-left:var(--sw);flex:1;padding:26px 28px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .topbar h1{font-size:1.35rem;font-weight:700;}.topbar p{color:var(--muted);font-size:.8rem;margin-top:1px;}
  .btn-primary{background:var(--green);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-family:'Poppins',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .2s;}
  .btn-primary:hover{background:var(--green-light);}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .sc{background:#fff;border-radius:13px;padding:16px;box-shadow:var(--shadow);border:1px solid #eaf3ea;display:flex;align-items:center;gap:13px;}
  .sc-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
  .ig{background:var(--green-pale)}.io{background:#fff3e0}.ib{background:#e3f2fd}.ir{background:#fce4ec}
  .sc-info h3{font-size:1.35rem;font-weight:700;}.sc-info p{font-size:.73rem;color:var(--muted);margin-top:1px;}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #dde8dd;border-radius:10px;padding:8px 14px;flex:1;min-width:200px;}
  .search-box input{border:none;outline:none;font-family:'Poppins',sans-serif;font-size:.82rem;color:var(--text);background:transparent;width:100%;}

  /* VOLUNTEER CARDS GRID */
  .vol-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .vol-card{background:#fff;border-radius:14px;padding:18px;box-shadow:var(--shadow);border:1.5px solid #eaf3ea;transition:all .2s;}
  .vol-card:hover{transform:translateY(-2px);border-color:var(--green-accent);}
  .vc-top{display:flex;align-items:center;gap:13px;margin-bottom:14px;}
  .vc-avatar{width:46px;height:46px;border-radius:50%;font-size:.9rem;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .vc-info h4{font-size:.9rem;font-weight:700;}
  .vc-info p{font-size:.74rem;color:var(--muted);margin-top:1px;}
  .vc-status{margin-left:auto;font-size:.72rem;font-weight:600;}
  .online{color:var(--green)}.offline{color:#bdbdbd}
  .vc-details{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
  .vc-detail{display:flex;align-items:center;gap:7px;font-size:.76rem;color:var(--muted);}
  .vc-detail span:first-child{font-size:.9rem;}
  .vc-actions{display:flex;gap:8px;}
  .ab{border:none;border-radius:7px;padding:6px 12px;font-family:'Poppins',sans-serif;font-size:.72rem;font-weight:600;cursor:pointer;transition:opacity .2s;flex:1;}
  .ab:hover{opacity:.75;}.ab.edit{background:#e3f2fd;color:#1565c0;}.ab.del{background:#fce4ec;color:#c62828;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1;}
  .empty-state .es-icon{font-size:3rem;margin-bottom:12px;}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:460px;box-shadow:0 8px 40px rgba(0,0,0,.18);}
  .modal h3{font-size:1.05rem;font-weight:700;margin-bottom:18px;}
  .fg{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
  .fg label{font-size:.73rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .fg input,.fg select{border:1.5px solid #dde8dd;border-radius:9px;padding:9px 12px;font-family:'Poppins',sans-serif;font-size:.82rem;color:var(--text);outline:none;transition:border-color .2s;}
  .fg input:focus,.fg select:focus{border-color:var(--green-accent);}
  .fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;}
  .btn-cancel{background:#f4f6f4;color:var(--text);border:none;border-radius:9px;padding:9px 18px;font-family:'Poppins',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;}
  .btn-save{background:var(--green);color:#fff;border:none;border-radius:9px;padding:9px 20px;font-family:'Poppins',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .2s;}
  .btn-save:hover{background:var(--green-light);}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:12px 20px;border-radius:10px;font-size:.82rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;}
  .toast.show{opacity:1;transform:translateY(0);}
  ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-thumb{background:#c8e6c9;border-radius:10px;}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-logo">
    <div class="logo-row"><div class="li">🍱</div><h2>Save <span>Bite</span></h2></div>
    <div class="ngo-badge"><div class="ngo-ava">🏥</div><div class="ngo-badge-info"><div class="nb-name">Edhi Foundation</div><div class="nb-type">NGO Account</div></div></div>
  </div>
  <nav class="sb-nav">
    <div class="nl">Menu</div>
    <a class="ni" href="NGO/ngo_dashboard.php"><span class="ic">📊</span> Dashboard</a>
    <a class="ni" href="NGO/browse_food.php"><span class="ic">🍽️</span> Browse Food</a>
    <a class="ni" href="NGO/my_request.php"><span class="ic">📋</span> My Requests</a>
    <a class="ni" href="NGO/pickup.php"><span class="ic">🚚</span> Pickups</a>
    <div class="nl" style="margin-top:10px;">Account</div>
    <a class="ni" href="ngo_profile.html"><span class="ic">🏢</span> NGO Profile</a>
    <a class="ni active" href="NGO/volunteer.php"><span class="ic">👥</span> Volunteers</a>
    <a class="ni" href="ngo_impact.html"><span class="ic">📈</span> My Impact</a>
    <a class="ni" href="ngo-settings.html"><span class="ic">⚙️</span> Settings</a>
  </nav>
  <div class="sb-bot"><div class="lo"><span>⏻</span><span>Logout</span></div></div>
</aside>

<main class="main">
  <div class="topbar">
    <div><h1>Volunteers</h1><p>Manage volunteers assigned to your NGO.</p></div>
    <button class="btn-primary" onclick="openModal()">➕ Add Volunteer</button>
  </div>

  <div class="stats-row">
    <div class="sc"><div class="sc-icon ig">👥</div><div class="sc-info"><h3 id="s-total">0</h3><p>Total</p></div></div>
    <div class="sc"><div class="sc-icon ig">🟢</div><div class="sc-info"><h3 id="s-online">0</h3><p>Online</p></div></div>
    <div class="sc"><div class="sc-icon io">🚚</div><div class="sc-info"><h3 id="s-drivers">0</h3><p>Drivers</p></div></div>
    <div class="sc"><div class="sc-icon ib">📋</div><div class="sc-info"><h3 id="s-coord">0</h3><p>Coordinators</p></div></div>
  </div>

  <div class="toolbar">
    <div class="search-box">🔍 <input type="text" id="searchInput" placeholder="Search volunteer name..." oninput="renderCards()"></div>
  </div>

  <div class="vol-grid" id="volGrid"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Add Volunteer</h3>
    <div class="fg-row">
      <div class="fg"><label>Full Name</label><input type="text" id="f-name" placeholder="Name"></div>
      <div class="fg"><label>Role</label>
        <select id="f-role">
          <option>Pickup Driver</option>
          <option>Coordinator</option>
          <option>Distributor</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>Phone</label><input type="tel" id="f-phone" placeholder="Phone"></div>
      <div class="fg"><label>Status</label>
        <select id="f-status">
          <option value="online">Online</option>
          <option value="offline">Offline</option>
        </select>
      </div>
    </div>
    <div class="fg"><label>Area</label><input type="text" id="f-area" placeholder="City/Area"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveVol()">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const COLORS=['#43a047','#1976d2','#8e24aa','#f57c00','#e53935','#00897b'];
  let editId=null;

  function seed(){
    if(localStorage.getItem('sb_volunteers'))return;
    localStorage.setItem('sb_volunteers',JSON.stringify([
      {id:1,name:'Ali Khan',role:'Pickup Driver',phone:'+92 300 1111111',area:'Karachi',status:'online'},
      {id:2,name:'Sara Raza',role:'Coordinator',phone:'+92 301 2222222',area:'Karachi',status:'online'},
      {id:3,name:'M. Naveed',role:'Pickup Driver',phone:'+92 302 3333333',area:'Lahore',status:'offline'},
      {id:4,name:'Zara Aslam',role:'Distributor',phone:'+92 303 4444444',area:'Karachi',status:'online'},
    ]));
  }

  function getVols(){return JSON.parse(localStorage.getItem('sb_volunteers')||'[]');}
  function saveVols(arr){localStorage.setItem('sb_volunteers',JSON.stringify(arr));}
  function nextId(arr){return arr.length?Math.max(...arr.map(x=>x.id))+1:1;}
  function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
  function colorFor(i){return COLORS[i%COLORS.length];}

  function updateStats(){
    const v=getVols();
    document.getElementById('s-total').textContent  =v.length;
    document.getElementById('s-online').textContent =v.filter(x=>x.status==='online').length;
    document.getElementById('s-drivers').textContent=v.filter(x=>x.role==='Pickup Driver').length;
    document.getElementById('s-coord').textContent  =v.filter(x=>x.role==='Coordinator').length;
  }

  function renderCards(){
    const vols  =getVols();
    const search=document.getElementById('searchInput').value.toLowerCase();
    const f=vols.filter(v=>v.name.toLowerCase().includes(search));
    const grid=document.getElementById('volGrid');
    if(!f.length){grid.innerHTML=`<div class="empty-state"><div class="es-icon">👥</div><h3>No volunteers found.</h3></div>`;return;}
    grid.innerHTML=f.map((v,i)=>`
      <div class="vol-card">
        <div class="vc-top">
          <div class="vc-avatar" style="background:${colorFor(i)};">${initials(v.name)}</div>
          <div class="vc-info">
            <h4>${v.name}</h4>
            <p>${v.role}</p>
          </div>
          <span class="vc-status ${v.status}">● ${v.status.charAt(0).toUpperCase()+v.status.slice(1)}</span>
        </div>
        <div class="vc-details">
          <div class="vc-detail"><span>📞</span> ${v.phone}</div>
          <div class="vc-detail"><span>📍</span> ${v.area}</div>
          <div class="vc-detail"><span>🏷️</span> ${v.role}</div>
        </div>
        <div class="vc-actions">
          <button class="ab edit" onclick="editVol(${v.id})">✏️ Edit</button>
          <button class="ab del"  onclick="deleteVol(${v.id})">🗑️ Remove</button>
        </div>
      </div>`).join('');
  }

  function openModal(pre=null){
    editId=pre?pre.id:null;
    document.getElementById('modalTitle').textContent=pre?'Edit Volunteer':'Add Volunteer';
    document.getElementById('f-name').value  =pre?pre.name  :'';
    document.getElementById('f-role').value  =pre?pre.role  :'Pickup Driver';
    document.getElementById('f-phone').value =pre?pre.phone :'';
    document.getElementById('f-status').value=pre?pre.status:'online';
    document.getElementById('f-area').value  =pre?pre.area  :'';
    document.getElementById('modalOverlay').classList.add('show');
  }
  function closeModal(){document.getElementById('modalOverlay').classList.remove('show');editId=null;}

  function saveVol(){
    const name  =document.getElementById('f-name').value.trim();
    const role  =document.getElementById('f-role').value;
    const phone =document.getElementById('f-phone').value.trim();
    const status=document.getElementById('f-status').value;
    const area  =document.getElementById('f-area').value.trim();
    if(!name){showToast('⚠️ Name is required!');return;}
    let vols=getVols();
    if(editId){
      vols=vols.map(v=>v.id===editId?{...v,name,role,phone,status,area}:v);
      showToast('✅ Volunteer updated!');
    }else{
      vols.push({id:nextId(vols),name,role,phone,status,area});
      showToast('✅ Volunteer added!');
    }
    saveVols(vols);closeModal();renderCards();updateStats();
  }

  function editVol(id){const v=getVols().find(x=>x.id===id);if(v)openModal(v);}
  function deleteVol(id){
    if(!confirm('Remove this volunteer?'))return;
    saveVols(getVols().filter(v=>v.id!==id));
    showToast('🗑️ Volunteer removed.');renderCards();updateStats();
  }

  function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
  document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
  seed();renderCards();updateStats();
</script>
</body>
</html>
